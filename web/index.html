<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>StylLink</title>
<style>
  :root {
    --bg: #000; --fg: #c9d1d9; --dim: #6b7682; --edge: #2c323b;
    --ok: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #screen { inset: auto; image-rendering: pixelated; pointer-events: none; }
  #connectionNotice {
    position: fixed; z-index: 1; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%); width: min(480px, calc(100% - 32px)); padding: 16px;
    border: 1px solid var(--bad); border-radius: 12px; background: #1c2128f5;
    box-shadow: 0 8px 24px #0008; touch-action: manipulation;
  }
  #connectionNotice p { margin: 8px 0 12px; }
  #connectionNotice button {
    padding: 10px; border-radius: 8px; border: 1px solid var(--edge);
    background: #2d333b; color: var(--fg); font: inherit;
  }

  /* Invisible top-right hot corner; hover (mouse/pen) or tap unfolds the panel. */
  #hud { position: fixed; z-index: 2; top: 0; right: 0; display: flex; flex-direction: column; align-items: flex-end; }
  #corner { width: 48px; height: 48px; }
  #panel {
    display: none; flex-direction: column; gap: 12px; width: 260px; margin: 0 8px 8px 0; padding: 14px;
    border-radius: 12px; background: #1c2128f5; border: 1px solid var(--edge);
    box-shadow: 0 8px 24px #0008; touch-action: manipulation;
  }
  #hud.open #panel { display: flex; }
  #status { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.ok { background: var(--ok); }
  #panel label { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 28px; }
  #panel input { width: 22px; height: 22px; accent-color: #58a6ff; }
  #panel button {
    padding: 10px; border-radius: 8px; border: 1px solid var(--edge); background: #2d333b; color: var(--fg); font: inherit;
  }
  #panel small { color: var(--dim); }
  #connForm { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--edge); }
  #connForm input {
    width: 150px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--edge);
    background: #0d1117; color: var(--fg); font: inherit;
  }
</style>
</head>
<body>
<canvas id="screen" hidden></canvas>
<canvas id="pad"></canvas>
<div id="connectionNotice" role="status" aria-live="polite" hidden>
  <strong id="connectionTitle"></strong>
  <p id="connectionHelp"></p>
  <button id="btnConnectionSettings" type="button">Connection settings</button>
</div>
<div id="hud">
  <div id="corner"></div>
  <div id="panel">
    <div id="status"><div class="dot" id="dot"></div><span id="stat">connecting…</span></div>
    <form id="connForm" autocomplete="off">
      <label>PC address <input id="connHost" placeholder="192.168.0.75:8080" inputmode="url"></label>
      <label>Token <input id="connToken" placeholder="from the terminal"></label>
      <button type="submit">Connect</button>
    </form>
    <label>Finger drawing <input type="checkbox" id="optFinger"></label>
    <label>Mouse drawing <input type="checkbox" id="optMouse"></label>
    <label>Keep screen aspect (adds bars) <input type="checkbox" id="optBox"></label>
    <label>Ink trail preview <input type="checkbox" id="optTrail"></label>
    <label>Show PC screen <input type="checkbox" id="optScreen"></label>
    <label>Prefer H.264 screen <input type="checkbox" id="optH264"></label>
    <label>Keep Wi-Fi awake <input type="checkbox" id="optAwake"></label>
    <button id="btnFs">Fullscreen</button>
    <button id="btnAndroid" hidden>Open in Android app</button>
    <small id="info"></small>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const pad = $("pad");
const ctx = pad.getContext("2d", { desynchronized: true });

// ---------------------------------------------------------------- settings
// The pad fills the whole tablet by default; letterboxing keeps proportions
// exact but leaves bars where the tablet and monitor shapes differ.
const opts = { letterbox: false, trail: true, finger: false, mouse: false, awake: true, screen: true, h264: false };
try { Object.assign(opts, JSON.parse(localStorage.getItem("styllink") || "{}")); } catch {}
const saveOpts = () => { try { localStorage.setItem("styllink", JSON.stringify(opts)); } catch {} };
for (const [k, id] of [["finger", "optFinger"], ["mouse", "optMouse"], ["letterbox", "optBox"], ["trail", "optTrail"], ["awake", "optAwake"], ["screen", "optScreen"], ["h264", "optH264"]]) {
  const el = $(id);
  el.checked = opts[k];
  el.onchange = () => {
    opts[k] = el.checked; saveOpts(); layout(); sendCaps();
    if (k === "screen" || k === "h264") restartScreen();
  };
}

// pointerrawupdate delivers samples as soon as they arrive instead of once per
// frame; Chrome only exposes it in secure contexts (https or localhost).
const RAW = "onpointerrawupdate" in window;
// getCoalescedEvents (all samples between frames) is secure-context only too.
const COALESCED = typeof PointerEvent !== "undefined" && typeof PointerEvent.prototype.getCoalescedEvents === "function";
$("info").textContent = RAW
  ? "Raw pointer events: on (lowest latency)."
  : COALESCED
    ? "Raw pointer events unavailable: needs a secure origin. Using coalesced events."
    : "Insecure origin: only one pen sample per frame, so fast strokes get choppy. See the terminal for the fix.";

// ---------------------------------------------------------------- hud
// Hidden until hovered (mouse/pen, after a short dwell) or tapped. A tap pins
// it open; tapping the corner again or anywhere on the pad closes it.
const hud = $("hud");
let pinned = false, dwell = 0;
const setOpen = (v) => hud.classList.toggle("open", v);
hud.addEventListener("pointerenter", (e) => {
  if (e.pointerType === "touch") return;
  clearTimeout(dwell);
  dwell = setTimeout(() => setOpen(true), 250);
});
hud.addEventListener("pointerleave", (e) => {
  if (e.pointerType === "touch") return;
  clearTimeout(dwell);
  if (!pinned) setOpen(false);
});
$("corner").addEventListener("pointerup", () => { pinned = !pinned; setOpen(pinned); });
pad.addEventListener("pointerdown", () => { if (pinned) { pinned = false; setOpen(false); } });

// ---------------------------------------------------------------- fullscreen
async function goFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: "hide" });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch {}
  try { await navigator.wakeLock?.request("screen"); } catch {}
}
// Fullscreen needs a user gesture: take the very first one.
addEventListener("pointerup", () => { if (!document.fullscreenElement) goFullscreen(); }, { once: true });
$("btnFs").onclick = goFullscreen;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") navigator.wakeLock?.request("screen").catch(() => {});
});
for (const ev of ["contextmenu", "selectstart", "dragstart", "gesturestart"])
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener("touchstart", (e) => { if (e.target === pad) e.preventDefault(); }, { passive: false });

// ---------------------------------------------------------------- geometry
let aspect = 16 / 9;                     // target region w/h, sent by the server
let dpr = 1, region = { x: 0, y: 0, w: 1, h: 1 };
function layout() {
  dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  pad.width = Math.round(W * dpr); pad.height = Math.round(H * dpr);
  // The PC screen is always shown in its own shape; the pen maps onto it.
  const a = scr.on ? scr.w / scr.h : aspect;
  if (!opts.letterbox && !scr.on) region = { x: 0, y: 0, w: W, h: H };
  else if (W / H > a) { const w = H * a; region = { x: (W - w) / 2, y: 0, w, h: H }; }
  else { const h = W / a; region = { x: 0, y: (H - h) / 2, w: W, h }; }
  const sc = $("screen");
  sc.hidden = !scr.on;
  Object.assign(sc.style, { left: region.x + "px", top: region.y + "px", width: region.w + "px", height: region.h + "px" });
  dirty = true;
}
addEventListener("resize", layout);

// ---------------------------------------------------------------- socket
// Where the styllink server is. The page works from anywhere (e.g. a static
// HTTPS host, which unlocks the full-rate pen APIs): the terminal's QR code
// passes "#h=<ip:port>&t=<token>". The fragment never leaves the browser. When
// the server itself serves the page, the host defaults to the page's own.
const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const conn = { host: params.get("h") || "", token: params.get("t") || "" };
try {
  if (conn.host) localStorage.setItem("styllink-conn", JSON.stringify(conn));
  else Object.assign(conn, JSON.parse(localStorage.getItem("styllink-conn") || "{}"));
} catch {}
const servedByStyllink = location.protocol === "http:";
if (!conn.host && servedByStyllink) { conn.host = location.host; conn.token ||= params.get("t") || ""; }
if (location.hash) history.replaceState(null, "", location.pathname);   // keep the token out of the address bar
$("connHost").value = conn.host; $("connToken").value = conn.token;
$("connForm").onsubmit = (e) => {
  e.preventDefault();
  conn.host = $("connHost").value.trim().replace(/^\w+:\/\//, "").replace(/\/.*$/, "");
  conn.token = $("connToken").value.trim();
  try { localStorage.setItem("styllink-conn", JSON.stringify(conn)); } catch {}
  clearTimeout(reconnectTimer); clearTimeout(connectionTimer);
  if (ws) { ws.onopen = ws.onerror = ws.onclose = ws.onmessage = null; ws.close(); ws = null; }
  rtt = null; retry = 300; connect(); restartScreen();
};
// Use the form values so opening the app also works before pressing Connect.
$("btnAndroid").hidden = !/Android/i.test(navigator.userAgent);
$("btnAndroid").onclick = () => {
  const h = $("connHost").value.trim().replace(/^\w+:\/\//, "").replace(/\/.*$/, "");
  if (!h) { $("connHost").focus(); return; }
  const query = new URLSearchParams({ h, t: $("connToken").value.trim() });
  location.href = `styllink://connect?${query}`;
};
let ws = null, rtt = null, retry = 300, reconnectTimer = 0, connectionTimer = 0;
const online = () => ws && ws.readyState === 1;
$("btnConnectionSettings").onclick = () => {
  pinned = true; setOpen(true); $("connHost").focus();
};
function connectionNotice(failed = false, blocked = false) {
  const notice = $("connectionNotice");
  notice.hidden = !!online() || (!!conn.host && !failed);
  if (notice.hidden) return;
  $("connectionTitle").textContent = !conn.host ? "Connect to your PC" : "Unable to connect to your PC";
  let help = !conn.host
    ? "Open the complete browser link printed by StylLink on your PC, or enter the PC address and token in Connection settings."
    : "Keep StylLink running on your PC. Check the PC address and token, use the same Wi-Fi network, and check that the firewall allows the server port. Retrying automatically.";
  // WebSocket failures do not reveal their cause. Offer browser guidance as a
  // possibility instead of claiming every failure is a security restriction.
  if (conn.host && location.protocol === "https:") {
    if (/Firefox\//i.test(navigator.userAgent)) {
      help += " Firefox may block this HTTPS page from connecting to your PC's unencrypted WebSocket. Try the complete link in Chrome and allow local-network access, or use the Local browser fallback / USB localhost link printed in the terminal. The local HTTP page may have a lower pen sampling rate.";
    } else {
      help += " Allow local-network access if your browser requests it. If the connection is blocked, try the Local browser fallback or USB localhost link printed in the terminal.";
    }
  }
  if (blocked) help += " The browser rejected the connection address or blocked the request. Check the address in Connection settings.";
  $("connectionHelp").textContent = help;
}
function retryConnection() {
  clearTimeout(connectionTimer);
  ws = null; rtt = null; status(); connectionNotice(true);
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, retry);
  retry = Math.min(retry * 2, 3000);
}
function connect() {
  if (!conn.host) { status(); connectionNotice(); pinned = true; setOpen(true); return; }
  // Plain ws:// even from an https page: Chrome still allows it to LAN
  // addresses (after a "local network access" prompt); the server has no TLS.
  try { ws = new WebSocket(`ws://${conn.host}/ws?t=${encodeURIComponent(conn.token)}`); }
  catch { retryConnection(); connectionNotice(true, true); return; }
  const socket = ws;
  connectionTimer = setTimeout(() => {
    if (ws !== socket || online()) return;
    connectionNotice(true);
    socket.close();
  }, 8000);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { clearTimeout(connectionTimer); retry = 300; status(); connectionNotice(); sendCaps(); };
  ws.onerror = () => { if (ws === socket) connectionNotice(true); };
  ws.onmessage = (m) => {
    const d = m.data;
    if (typeof d !== "string") return;
    const k = d[0];
    if (k === "b" || k === "s") ws.send(d);                 // server's link benchmark ping
    else if (k === "p") { rtt = performance.now() - parseFloat(d.slice(1)); status(); }
    else if (k === "{") { const h = JSON.parse(d); aspect = h.w / h.h; layout(); }
  };
  ws.onclose = () => { if (ws === socket) retryConnection(); };
}
function status() {
  $("dot").classList.toggle("ok", !!online());
  $("stat").textContent = !conn.host ? "enter the PC address" : !online() ? `disconnected (${conn.host})`
    : rtt == null ? "connected" : `connected · rtt ${rtt.toFixed(1)} ms`;
  dirty = true;
}
setInterval(() => { if (online()) ws.send("p" + performance.now()); }, 1000);
function sendCaps() { if (online()) ws.send(`i${+RAW}${+COALESCED}${+opts.awake}${+opts.trail}`); }

// Wi-Fi power saving lets the tablet's radio doze between packets; data then
// leaves in bunches and the PC's ACKs come back late. A tiny message every
// 50 ms while the pen is quiet keeps the radio awake (costs some battery).
let lastSend = 0;
setInterval(() => {
  if (opts.awake && online() && performance.now() - lastSend > 45) { ws.send("k"); lastSend = performance.now(); }
}, 50);

// ---------------------------------------------------------------- PC screen
// A second socket, /video. We tell the server what we can show; it answers
// with the format ("c") and then sends either changed rectangles ("T": LZ4
// or raw, BGRX or RGB565) or H.264 access units ("H", via WebCodecs). Each
// shown frame is acknowledged so the server never runs ahead of us.
const scr = { on: false, w: 16, h: 9, ws: null, retry: 300, ctx: null, codec: "", dec: null, dup: new Set(), hz: 60, h264: false };
// Offer H.264 only if this browser really decodes it (open builds don't).
if (typeof VideoDecoder === "function")
  Promise.all(["avc1.42e01f", "avc1.640028"].map((codec) => VideoDecoder.isConfigSupported({ codec }).then((r) => r.supported, () => false)))
    .then((ok) => { scr.h264 = ok.some(Boolean); });
function lz4(src, dst) {
  let ip = 0, op = 0;
  while (ip < src.length) {
    const token = src[ip++];
    let lit = token >> 4;
    if (lit === 15) { let b; do { b = src[ip++]; lit += b; } while (b === 255); }
    dst.set(src.subarray(ip, ip + lit), op); ip += lit; op += lit;
    if (ip >= src.length) break;
    const off = src[ip] | src[ip + 1] << 8; ip += 2;
    let ml = token & 15;
    if (ml === 15) { let b; do { b = src[ip++]; ml += b; } while (b === 255); }
    ml += 4;
    if (off >= ml) dst.copyWithin(op, op - off, op - off + ml);
    else for (let i = 0; i < ml; i++) dst[op + i] = dst[op + i - off];
    op += ml;
  }
  return op;
}
function avcCodec(au) {   // "avc1.PPCCLL" from the SPS
  for (let i = 0; i + 7 < au.length; i++) {
    if (au[i] === 0 && au[i + 1] === 0 && au[i + 2] === 1 && (au[i + 3] & 31) === 7)
      return "avc1." + [au[i + 4], au[i + 5], au[i + 6]].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  return null;
}
// Measure the refresh rate before saying hello (120 Hz tablets matter).
(function measure(n = 0, t0 = 0) {
  requestAnimationFrame((t) => {
    if (n === 0) return measure(1, t);
    if (n < 30) return measure(n + 1, t0);
    scr.hz = Math.round(29000 / (t - t0)) || 60;
  });
})();
function restartScreen() {
  if (scr.ws) { scr.ws.onclose = null; scr.ws.close(); scr.ws = null; }
  if (scr.dec) { try { scr.dec.close(); } catch {} scr.dec = null; }
  scr.on = false; layout();
  if (opts.screen) connectScreen();
}
function connectScreen() {
  if (!conn.host || !opts.screen) return;
  let s;
  try { s = new WebSocket(`ws://${conn.host}/video?t=${encodeURIComponent(conn.token)}`); } catch { return; }
  scr.ws = s;
  s.binaryType = "arraybuffer";
  const ack = (id) => { if (s.readyState === 1) s.send("a" + id); };
  s.onopen = () => {
    scr.retry = 300;
    const usb = /^(localhost|127\.0\.0\.1|\[::1\])(:|$)/.test(conn.host);
    const codecs = "tiles" + (scr.h264 ? ",h264" : "");
    s.send(`hv=1;w=${Math.round(screen.width * dpr)};h=${Math.round(screen.height * dpr)};hz=${scr.hz}` +
      `;pix=bgrx,rgb565;enc=lz4,raw;codec=${codecs};link=${usb ? "usb" : "wifi"}${opts.h264 ? ";prefer=h264" : ""}`);
  };
  let img = null, raw = new Uint8Array(0);
  s.onmessage = (m) => {
    const d = m.data;
    if (typeof d === "string") {
      if (d[0] === "c") {
        const c = Object.fromEntries(d.slice(1).split(";").map((kv) => kv.split("=")));
        const sc = $("screen");
        scr.w = +c.w; scr.h = +c.h; scr.codec = c.codec;
        if (sc.width !== scr.w || sc.height !== scr.h || !scr.ctx) {
          sc.width = scr.w; sc.height = scr.h;
          scr.ctx = sc.getContext("2d", { desynchronized: true, alpha: false });
        }
        scr.on = true; layout();
      } else if (d[0] === "e") {
        $("info").textContent = "Screen: " + d.slice(1);
      } else if (d[0] === "p") {
        // our own ping on this socket: ignore
      }
      return;
    }
    const b = new Uint8Array(d), v = new DataView(d);
    if (b[0] === 84 && scr.ctx) {            // 'T': one changed rectangle
      const flags = b[1], enc = b[2], pix = b[3], id = v.getUint32(4, true);
      const x = v.getUint16(12, true), y = v.getUint16(14, true), w = v.getUint16(16, true), h = v.getUint16(18, true);
      const n = v.getUint32(20, true);
      let src = b.subarray(24);
      if (enc === 1) { if (raw.length < n) raw = new Uint8Array(n * 2); lz4(src, raw); src = raw; }
      if (!img || img.width !== w || img.height !== h) img = new ImageData(w, h);
      const out = img.data, px = w * h;
      if (pix === 0) {
        for (let i = 0, o = 0; i < px; i++, o += 4) { out[o] = src[o + 2]; out[o + 1] = src[o + 1]; out[o + 2] = src[o]; out[o + 3] = 255; }
      } else {
        for (let i = 0, o = 0; i < px; i++, o += 4) {
          const p = src[2 * i] | src[2 * i + 1] << 8;
          out[o] = (p >> 8) & 0xf8; out[o + 1] = (p >> 3) & 0xfc; out[o + 2] = (p << 3) & 0xf8; out[o + 3] = 255;
        }
      }
      scr.ctx.putImageData(img, x, y);
      if (flags & 1) ack(id);
    } else if (b[0] === 72 && scr.ctx) {     // 'H': one H.264 access unit
      const flags = b[1], id = v.getUint32(4, true), au = b.subarray(16);
      if (!scr.dec) {
        const codec = avcCodec(au);
        if (!codec) return;
        scr.dec = new VideoDecoder({
          output: (frame) => {
            scr.ctx.drawImage(frame, 0, 0, scr.w, scr.h);
            const fid = frame.timestamp / 1000;
            frame.close();
            if (!scr.dup.delete(fid)) ack(fid);
          },
          error: () => { scr.dec = null; if (s.readyState === 1) s.send("k"); },
        });
        scr.dec.configure({ codec, optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
      }
      if (flags & 4) scr.dup.add(id);
      scr.dec.decode(new EncodedVideoChunk({ type: flags & 2 ? "key" : "delta", timestamp: id * 1000, data: au }));
    }
  };
  s.onclose = () => {
    if (scr.ws !== s) return;
    scr.ws = null; scr.on = false;
    if (scr.dec) { try { scr.dec.close(); } catch {} scr.dec = null; }
    layout();
    setTimeout(connectScreen, scr.retry); scr.retry = Math.min(scr.retry * 2, 3000);
  };
}
setTimeout(connectScreen, 600);   // after the refresh-rate measurement

// ---------------------------------------------------------------- samples
// Message: u32 send time (0.1 ms units, for the server's uplink stats), then
// 10 bytes per sample: u16 x, u16 y, u16 pressure, i8 tiltX, i8 tiltY, u8 flags,
// u8 age (how long before the send time the pen was there, 0.5 ms units; the
// server uses it to replay bursts with their original spacing)
const IN_RANGE = 1, TOUCH = 2, BARREL = 4, ERASER = 8;
const MAX_BATCH = 64;
const out = new DataView(new ArrayBuffer(4 + 10 * MAX_BATCH));
const bytes = new Uint8Array(out.buffer);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

function encode(i, e, inRange, now) {
  const isPen = e.pointerType === "pen";
  const touching = isPen ? (e.buttons & 33) !== 0 : e.buttons !== 0;
  let flags = 0;
  if (inRange && (isPen || touching)) flags |= IN_RANGE;
  if (flags && touching) flags |= TOUCH;
  if (isPen && e.buttons & 2) flags |= BARREL;
  if (isPen && e.buttons & 32) flags |= ERASER;
  const p = touching ? (e.pressure > 0 ? e.pressure : 0.5) : 0;
  const o = 4 + i * 10;
  out.setUint16(o, Math.round(clamp01((e.clientX - region.x) / region.w) * 65535), true);
  out.setUint16(o + 2, Math.round(clamp01((e.clientY - region.y) / region.h) * 65535), true);
  out.setUint16(o + 4, Math.round(clamp01(p) * 65535), true);
  out.setInt8(o + 6, e.tiltX | 0);
  out.setInt8(o + 7, e.tiltY | 0);
  out.setUint8(o + 8, flags);
  out.setUint8(o + 9, Math.max(0, Math.min(255, Math.round((now - e.timeStamp) * 2))));
  return flags;
}

function send(e, inRange) {
  if (!online()) return;
  const list = inRange && e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const evs = list.length ? list.slice(-MAX_BATCH) : [e];
  let flags = 0;
  const now = performance.now();
  for (let i = 0; i < evs.length; i++) flags = encode(i, evs[i], inRange, now);
  // When the link backs up, drop hover-only updates; ink is never dropped.
  if (!(flags & TOUCH) && flags & IN_RANGE && ws.bufferedAmount > 512) return;
  out.setUint32(0, Math.floor(now * 10) >>> 0, true);
  ws.send(bytes.subarray(0, 4 + evs.length * 10));
  lastSend = performance.now();
  if (opts.trail) {
    const predicted = inRange && typeof e.getPredictedEvents === "function" ? e.getPredictedEvents() : [];
    trail(evs, flags, predicted);
  }
}

// ---------------------------------------------------------------- pointer input
let activeId = null;
const accept = (e) =>
  e.pointerType === "pen" || (e.pointerType === "touch" && opts.finger) || (e.pointerType === "mouse" && opts.mouse);

pad.addEventListener("pointerdown", (e) => {
  if (!accept(e)) return;
  if (activeId !== null && activeId !== e.pointerId) return;
  activeId = e.pointerId;
  pad.setPointerCapture(e.pointerId);
  send(e, true);
});
const onMove = (e) => {
  if (!accept(e)) return;
  if (activeId === null && e.pointerType === "pen") activeId = e.pointerId; // hover entering
  if (e.pointerId !== activeId) return;
  send(e, true);
};
if (RAW) pad.addEventListener("pointerrawupdate", onMove);
else pad.addEventListener("pointermove", onMove);
pad.addEventListener("pointerup", (e) => {
  if (e.pointerId !== activeId) return;
  send(e, e.pointerType === "pen");       // pen keeps hovering; touch/mouse leave
  if (e.pointerType !== "pen") activeId = null;
  lastPt = null;
});
for (const type of ["pointercancel", "pointerleave"]) {
  pad.addEventListener(type, (e) => {
    if (e.pointerId !== activeId) return;
    send(e, false);
    activeId = null;
    lastPt = null;
  });
}

// ---------------------------------------------------------------- local preview
// Purely cosmetic: a short fading trail so you can see where the pen is. The
// pad frame turns red while disconnected, the only status shown when folded.
const segs = [];
let lastPt = null, cursor = null, dirty = true;
function trail(evs, flags, predicted) {
  const list = Array.isArray(evs) ? evs : (evs ? [evs] : []);
  const now = performance.now();
  for (const e of list) {
    const pt = { x: e.clientX, y: e.clientY };
    const touching = (flags & TOUCH) !== 0;
    if (touching && lastPt) segs.push({ a: lastPt, b: pt, w: 1 + 4 * (e.pressure || 0.5), t: now, er: flags & ERASER });
    lastPt = touching ? pt : null;
    cursor = flags & IN_RANGE ? pt : null;
  }
  if ((!predicted || !predicted.length) && list.length) {
    const last = list[list.length - 1];
    if (typeof last?.getPredictedEvents === "function") {
      try { predicted = last.getPredictedEvents(); } catch {}
    }
  }
  if (predicted && predicted.length) {
    for (const p of predicted) {
      const pt = { x: p.clientX, y: p.clientY };
      const touching = (flags & TOUCH) !== 0;
      if (touching && lastPt) segs.push({ a: lastPt, b: pt, w: 1 + 4 * (p.pressure || 0.5), t: now, er: flags & ERASER });
      lastPt = touching ? pt : null;
      cursor = flags & IN_RANGE ? pt : null;
    }
  }
  if (segs.length > 4000) segs.splice(0, segs.length - 4000);
  dirty = true;
}
const FADE = 900;
function frame() {
  const now = performance.now();
  while (segs.length && now - segs[0].t > FADE) segs.shift();
  if (dirty || segs.length) {
    dirty = false;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);   // the PC screen shows through
    ctx.strokeStyle = online() ? "#1a1d22" : "#f8514966";
    ctx.lineWidth = 1;
    ctx.strokeRect(region.x + 0.5, region.y + 0.5, region.w - 1, region.h - 1);
    ctx.lineCap = "round";
    for (const s of segs) {
      ctx.globalAlpha = 1 - (now - s.t) / FADE;
      ctx.strokeStyle = s.er ? "#f85149" : "#e6edf3";
      ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.a.x, s.a.y); ctx.lineTo(s.b.x, s.b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (cursor && opts.trail) {
      ctx.strokeStyle = "#6b7682";
      ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 6, 0, Math.PI * 2); ctx.stroke();
      dirty = true;
      cursor = null;
    }
  }
  requestAnimationFrame(frame);
}
layout();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
